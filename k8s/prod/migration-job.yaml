apiVersion: batch/v1
kind: Job
metadata:
  name: identidade-carioca-mapping-migrate
  namespace: identidade-carioca-mapping
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/prefeitura-rio/identidade-carioca-mapping:sha-34e33a191c6b200c21f8a675fdd31f7d4cc5393a@sha256:f0ededa240d235353e9f8ffd4116f76c368798d6379d1cf25a9a3fdbc77870b3
          command: ["/app/.venv/bin/alembic"]
          args: ["upgrade", "head"]
          envFrom:
            - secretRef:
                name: heimdall-secrets
