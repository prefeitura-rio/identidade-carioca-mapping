apiVersion: batch/v1
kind: Job
metadata:
  name: identidade-carioca-mapping-smoke-seed
  namespace: identidade-carioca-mapping
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c
              "SELECT 1 FROM actions LIMIT 1" >/dev/null 2>&1; do sleep 5; done;
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c
              "INSERT INTO actions (name, description) VALUES ('identity:health', 'POC6 mapping smoke action') ON CONFLICT (name) DO NOTHING;
              INSERT INTO endpoints (path_pattern, method, action_id, description)
              SELECT '/api/v1/healthz', 'GET', id, 'POC6 mapping smoke endpoint'
              FROM actions WHERE name = 'identity:health'
              ON CONFLICT (path_pattern, method) DO NOTHING;"
          envFrom:
            - secretRef:
                name: heimdall-secrets
