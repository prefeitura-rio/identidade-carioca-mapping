apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: base-chart
  namespace: identidade-carioca-mapping
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/prefeitura-rio/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: identidade-carioca-mapping
  namespace: identidade-carioca-mapping
spec:
  interval: 10m
  chart:
    spec:
      chart: base-chart
      version: 2.4.2
      sourceRef:
        kind: HelmRepository
        name: base-chart
      interval: 1h
  values:
    replicaCount: 2
    fullnameOverride: identidade-carioca-mapping
    image:
      repository: ghcr.io/prefeitura-rio/identidade-carioca-mapping
      tag: sha-9a5e4a7bedadc4b878c3fd850c5d779c997de204@sha256:db01eafe647b2682bd2f195663cf4208778ad6e65f0b210c5d261d8c93a77268
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8000
      containerPort: 8080
    resources:
      requests: { memory: 256Mi, cpu: 500m }
      limits: { memory: 512Mi, cpu: 2000m }
    healthCheck: { path: /api/v1/readyz }
    podSecurityContext: { fsGroup: 1000 }
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    envFrom:
      - secretRef: { name: heimdall-secrets }
    env:
      - name: REDIS_SENTINEL_HOSTS
        value: redis-announce-0.cerbos-redis.svc.cluster.local:26379,redis-announce-1.cerbos-redis.svc.cluster.local:26379
      - name: REDIS_SENTINEL_SERVICE_NAME
        value: mymaster
    infisicalSecret:
      enabled: true
      secretName: heimdall-secrets
      projectSlug: identidade-carioca-mapping-dgl-j
      envSlug: staging
      creationPolicy: Orphan
      universalAuth:
        credentialsRef:
          secretName: universal-auth-credentials
          secretNamespace: infisical-operator-system
    istio:
      enabled: false
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 25
      keda: { enabled: false }
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
