apiVersion: batch/v1
kind: Job
metadata:
  name: identidade-carioca-mapping-rebuild-projection
  namespace: identidade-carioca-mapping
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rebuild-projection
          image: ghcr.io/prefeitura-rio/identidade-carioca-mapping:sha-1c9b241fe8cda7ba20ea5709043f6b69e03c82f5@sha256:4b822b6ba6cc47c4bf05d7ae59f0b1fd7007c61ae78bb93537c42fd97349d87c
          command: ["/app/.venv/bin/python"]
          args: ["-m", "app.rebuild_mapping_projection"]
          envFrom:
            - secretRef:
                name: heimdall-secrets
