apiVersion: batch/v1
kind: Job
metadata:
  name: openapi-catalog-import-v3
  namespace: identidade-carioca-mapping
  labels:
    app.kubernetes.io/name: openapi-catalog-import
    app.kubernetes.io/part-of: identidade-carioca-mapping
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openapi-catalog-import
    spec:
      restartPolicy: Never
      containers:
        - name: openapi-catalog-import
          image: ghcr.io/prefeitura-rio/identidade-carioca-mapping:sha-9a5e4a7bedadc4b878c3fd850c5d779c997de204@sha256:db01eafe647b2682bd2f195663cf4208778ad6e65f0b210c5d261d8c93a77268
          command: ["/app/.venv/bin/python"]
          args: ["-m", "app.import_openapi_catalog"]
          env:
            - name: OPENAPI_SOURCE_URL
              value: https://raw.githubusercontent.com/prefeitura-rio/app-rmi/ce77e9f9d8bf68d8aa416b0c56be8620a7e7e07d/docs/openapi-v3.json
            - name: OPENAPI_SOURCE_REVISION
              value: ce77e9f9d8bf68d8aa416b0c56be8620a7e7e07d
            - name: OPENAPI_CATALOG_NAME
              value: rmi
            - name: OPENAPI_API_VERSION
              value: v1
            - name: OPENAPI_ENVIRONMENT
              value: staging
            - name: OPENAPI_SERVER_URL
              value: https://services.staging.app.dados.rio/rmi/v1
            - name: REDIS_SENTINEL_HOSTS
              value: redis.cerbos-redis.svc.cluster.local:26379
            - name: REDIS_SENTINEL_SERVICE_NAME
              value: mymaster
          envFrom:
            - secretRef:
                name: heimdall-secrets
